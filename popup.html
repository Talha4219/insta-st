<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 220px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .header { font-size: 14px; font-weight: bold; margin-bottom: 10px; text-align: center; }
    button { 
      width: 100%; margin: 5px 0; padding: 10px; 
      cursor: pointer; border: none; border-radius: 6px;
      font-weight: 600; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.8; }
    .nav-btn { background: #262626; color: white; margin-bottom: 15px; }
    .click-btn { background: #0095f6; color: white; }
    .unclick-btn { background: #efefef; color: black; border: 1px solid #dbdbdb; }
    
    /* New Counter Styling */
    #counterContainer {
      margin-top: 12px;
      padding: 8px;
      background: #fafafa;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      text-align: center;
      font-size: 13px;
    }
    #hiddenCount { color: #0095f6; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">IG Story Automator</div>
  
  <button id="goToSettings" class="nav-btn">Open Settings Page</button>
  <hr>
  <button id="clickAll" class="click-btn">Hide All</button>
  <button id="unclickAll" class="unclick-btn">Unhide All</button>

  <div id="counterContainer">
    Processed: <span id="hiddenCount">0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
